# Stage 8 tier ladder — large (~2.8 M params).
# Same lean protocol as train_lean.yaml (100 ep, batch 128, AMP, cosine).

data_root: data/raw
add_root: data/raw_eval
machines: [fan, pump, slider, valve, ToyCar, ToyConveyor]
train_subdir: train
test_subdir: test
load_in_memory: false

ckpt_dir: checkpoints
result_dir: results
run_name: tier_large

epochs: 100
batch_size: 128
accum_steps: 1
num_workers: 8
pin_memory: true
amp: true
lr: 0.0001
weight_decay: 0.0
log_every: 50
eval_every: 10
ckpt_every: 100
val_fraction: 0.0
seed: 42

lr_scheduler:
  type: cosine
  t_max: 100
  eta_min: 0.00001
  start_epoch: 5
early_stopping:
  enabled: false
save_best: true
best_metric: auc
best_mode: max

wandb:
  enabled: true
  project: stgram-mfn
  entity: null
  group: tiers
  monitor: auc
  mode: max
  log_artifacts: true

hf_push:
  enabled: true
  repo_id: LakoreAI/stgram-mfn-tiers
  push_epochs: false

arch:
  c_dim: 128
  n_mels: 128
  embed_dim: 256
  bottleneck_setting: [[2, 192, 3, 2], [4, 192, 3, 2], [4, 192, 3, 2]]
